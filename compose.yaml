services:
  pipeline:
    image: apexflow:${APEXFLOW_IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
      args:
        APEXFLOW_REVISION: ${APEXFLOW_REVISION:-unknown}
    command: python -m apexflow --data /app/data --output /app/output
    user: "${APEXFLOW_UID:-10001}:${APEXFLOW_GID:-10001}"
    network_mode: none
    volumes:
      - ${APEXFLOW_DATA_DIR:-./data}:/app/data:ro
      - ${APEXFLOW_OUTPUT_DIR:-./output}:/app/output

  ui:
    image: apexflow:${APEXFLOW_IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
      args:
        APEXFLOW_REVISION: ${APEXFLOW_REVISION:-unknown}
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    user: "${APEXFLOW_UID:-10001}:${APEXFLOW_GID:-10001}"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - ${APEXFLOW_DATA_DIR:-./data}:/app/data:ro
      - ${APEXFLOW_OUTPUT_DIR:-./output}:/app/output:ro
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    network_mode: none
