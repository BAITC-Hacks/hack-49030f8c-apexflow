name: container-ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require production pull requests to come from this repository's staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" = main ]; then
            test "$HEAD_REF" = staging
            test "$HEAD_REPOSITORY" = "$REPOSITORY"
          fi
  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js
      - run: node --test tests/test_site.mjs
  compose-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and run contract tests in the test image
        run: docker compose --profile test run --rm --build tests
  runtime-smoke:
    runs-on: ubuntu-latest
    env:
      APEXFLOW_DATA_DIR: ./.ci/data
      APEXFLOW_OUTPUT_DIR: ./.ci/output
      APEXFLOW_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare writable synthetic data and output directories
        run: |
          mkdir -p .ci/data .ci/output
          echo "APEXFLOW_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APEXFLOW_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the release runtime image
        run: docker compose build pipeline ui
      - name: Generate clearly synthetic inputs inside the runtime image
        run: docker compose run --rm --no-deps -v "$PWD/.ci/data:/fixture" pipeline python -m scripts.ci_smoke create /fixture
      - name: Run the pipeline and wait for the dependent UI
        run: docker compose up --wait --wait-timeout 120 ui
      - name: Verify fresh results, exact gids and UI HTTP readiness
        run: docker compose exec -T ui python -m scripts.ci_smoke verify /app/data /app/output
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > .ci/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-runtime-smoke
          path: |
            .ci/compose.log
            .ci/output/
      - name: Stop containers
        if: always()
        run: docker compose down
