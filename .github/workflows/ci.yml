name: container-ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js
      - run: node --test tests/test_site.mjs
  compose-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and run contract tests in the test image
        run: docker compose --profile test run --rm --build tests
