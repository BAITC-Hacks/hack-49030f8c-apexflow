name: container-ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the synthetic web demo in a container
        run: docker run --rm --network none -v "$PWD:/work:ro" -w /work node:22-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85 sh -c 'node --check site/app.js && node --test tests/test_site.mjs'
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: apexflow-ci
      APEXFLOW_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and run the complete synthetic Compose scenario
        run: bash tests/compose_smoke.sh
      - name: Save synthetic-only diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-integration-${{ github.run_id }}
          path: .ci/smoke.*/reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure containers are stopped
        if: always()
        run: docker compose down --remove-orphans
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require production pull requests to come from this repository's staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" = main ]; then
            test "$HEAD_REF" = staging
            test "$HEAD_REPOSITORY" = "$REPOSITORY"
          fi
  compose-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and run contract tests in the test image
        run: docker compose --profile test run --rm --build tests
